[project]
name = "chess-evaluation-cnn"
version = "0.1.0"
description = "Predict static chess position evaluations from FEN with a supervised CNN."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch==2.10.0",
    "torchvision==0.25.0",
    "numpy",
    "pandas",
    "matplotlib",
    "scikit-learn",
    "chess",
    "python-chess",
    "kaggle",
    "flask>=3.1.3",
    "gradio>=5.0",
    "pillow",
    "tqdm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
